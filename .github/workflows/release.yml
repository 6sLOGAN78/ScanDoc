name: scanDOC Production Release & Package CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Build & Development Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest
          pip install -e .[dev,pdf,server]

      - name: Run Pytest Suite
        run: |
          pytest

      - name: Build Source Distribution and Wheel
        run: |
          python -m build

      - name: Validate PyPI Wheel & Package Metadata
        run: |
          twine check dist/*

      - name: Test Local-First Clean Wheel Installation
        run: |
          python -m venv clean_env
          source clean_env/bin/activate
          pip install dist/*.whl
          scandoc --version
          scandoc --help
          scandoc inspect --help
          scandoc convert --help
          scandoc serve --help
          scandoc benchmark --help
          python -c "import scandoc; print(scandoc.__version__)"

      - name: Test Server Extra Clean Installation
        run: |
          python -m venv server_env
          source server_env/bin/activate
          pip install dist/*.whl[server]
          scandoc serve --json

      - name: Upload Release Artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: scandoc-dist-${{ matrix.python-version }}
          path: dist/
